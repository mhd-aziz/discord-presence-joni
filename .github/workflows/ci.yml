name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check --line-length 110 --select E,F,W,I bridge bot companion

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install component dependencies
        run: pip install -r bot/requirements.txt -r companion/requirements.txt
      - name: Every script fails fast without its required variables
        run: |
          for script in bridge/bridge.py bot/bot.py companion/companion.py; do
            if output=$(python "$script" 2>&1); then
              echo "expected $script to exit non-zero"; exit 1
            fi
            echo "$output" | grep -q '\[config\] missing required env'
            echo "$script: fails fast as expected"
          done
      - name: Bridge serves health JSON
        env:
          JONI_BRIDGE_HOST: 127.0.0.1
          JONI_BRIDGE_PORT: "19191"
        run: |
          timeout 25 python bridge/bridge.py &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:19191/ -o /tmp/bridge.json && break
            sleep 0.5
          done
          python - <<'EOF'
          import json

          data = json.load(open("/tmp/bridge.json"))
          assert data["ok"] is True, data
          assert data["listening_on"] == ["127.0.0.1"], data
          assert "hermes_api" in data["checks"], data
          assert isinstance(data["backend_online"], bool), data
          print("bridge ok:", data)
          EOF
      - name: Companion runs in dry-run
        env:
          JONI_CLIENT_ID: "000000000000000000"
          JONI_BRIDGE_URL: http://127.0.0.1:19191/
          JONI_DRY_RUN: "1"
          JONI_POLL: "1"
          JONI_LOG: /tmp/companion.log
        run: |
          timeout 8 python companion/companion.py > /tmp/dry.log || true
          grep -q '\[dry\]' /tmp/dry.log
          cat /tmp/dry.log
      - name: Bot module loads without configuration
        run: |
          python - <<'EOF'
          import importlib.util

          spec = importlib.util.spec_from_file_location("bot", "bot/bot.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.env("JONI_BOT_TOKEN") is None
          assert module.backend_online() is False
          print("bot module ok")
          EOF

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r bot/requirements.txt -r companion/requirements.txt
